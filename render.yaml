# Render.com deployment blueprint for PathPilot AI backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: veyra-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: PathPilot AI
      - key: APP_VERSION
        value: 0.1.0
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false  # Set manually — cloud MySQL connection string
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random string
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        value: '["https://veyra3.netlify.app","http://localhost:5173"]'
      - key: PYTHON_VERSION
        value: "3.10.0"
